<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="canonical" href="https://commonplace.video/" />
    <title>Commonplace</title>
    <meta
      name="description"
      content="Turn YouTube videos into recaps you can skim, navigate, and share."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Commonplace" />
    <meta property="og:title" content="Commonplace" />
    <meta
      property="og:description"
      content="Turn YouTube videos into recaps you can skim, navigate, and share."
    />
    <meta
      property="og:image"
      content="https://commonplace.video/social-preview.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Commonplace — A commonplace book for video"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Commonplace" />
    <meta
      name="twitter:description"
      content="Turn YouTube videos into recaps you can skim, navigate, and share."
    />
    <meta
      name="twitter:image"
      content="https://commonplace.video/social-preview.png"
    />
    <meta
      name="twitter:image:alt"
      content="Commonplace — A commonplace book for video"
    />
    <script>
      let theme = null;
      try {
        theme = localStorage.getItem("theme");
      } catch {}
      if (theme !== "light" && theme !== "dark") {
        theme = matchMedia("(prefers-color-scheme: dark)").matches
          ? "dark"
          : "light";
      }
      document.documentElement.dataset.theme = theme;
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
