services:
  postgres:
    image: postgres:17-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: video_recaps
      POSTGRES_USER: video_recaps
      POSTGRES_PASSWORD: video_recaps
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U video_recaps -d video_recaps"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
