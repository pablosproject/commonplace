name: Changelog guard

on:
  pull_request:
    paths:
      - "skills/commonplace-youtube-recap/skill.json"
      - "skills/commonplace-youtube-recap/CHANGELOG.md"
      - ".claude-plugin/plugin.json"
      - "plugin.json"
      - ".github/plugin/marketplace.json"
  push:
    branches:
      - "**"
    paths:
      - "skills/commonplace-youtube-recap/skill.json"
      - "skills/commonplace-youtube-recap/CHANGELOG.md"
      - ".claude-plugin/plugin.json"
      - "plugin.json"
      - ".github/plugin/marketplace.json"

permissions:
  contents: read

jobs:
  skill-changelog:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check skill changelog changed with skill metadata
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="origin/${{ github.base_ref }}"
            RANGE="$BASE...HEAD"
          else
            if [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
              RANGE="HEAD~1..HEAD"
            else
              RANGE="${{ github.event.before }}..HEAD"
            fi
          fi

          CHANGED_FILES=$(git diff --name-only "$RANGE")

          if echo "$CHANGED_FILES" | grep -qx "skills/commonplace-youtube-recap/skill.json"; then
            if ! echo "$CHANGED_FILES" | grep -qx "skills/commonplace-youtube-recap/CHANGELOG.md"; then
              echo "skills/commonplace-youtube-recap/skill.json changed, but skills/commonplace-youtube-recap/CHANGELOG.md did not."
              echo "Update the skill changelog when releasing or changing skill metadata."
              exit 1
            fi
          fi

      - name: Check skill changelog has released version
        run: |
          VERSION=$(node -p "JSON.parse(require('fs').readFileSync('skills/commonplace-youtube-recap/skill.json', 'utf8')).version")

          if ! grep -Eq "^## \\[$VERSION\\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$" skills/commonplace-youtube-recap/CHANGELOG.md; then
            echo "skills/commonplace-youtube-recap/CHANGELOG.md must contain a release heading for $VERSION."
            echo "Expected: ## [$VERSION] - YYYY-MM-DD"
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Check plugin manifest versions
        run: npm run plugins:check-version
